name: Lean

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Get mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee mathlib-cache.log

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          lake build 2>&1 | tee lake-build.log

      - name: Audit publication theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean \
            -D maxSynthPendingDepth=3 \
            -D weak.linter.mathlibStandardSet=true \
            -D relaxedAutoImplicit=false \
            -D pp.unicode.fun=true \
            ExoticCCR/PublicationAxiomAudit.lean 2>&1 | tee publication-axioms.log
          python3 scripts/check_publication_axioms.py publication-axioms.log

      - name: Upload build and axiom provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-publication-provenance-${{ github.sha }}
          path: |
            mathlib-cache.log
            lake-build.log
            publication-axioms.log
          if-no-files-found: warn
