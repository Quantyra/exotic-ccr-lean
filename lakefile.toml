name = "exotic-ccr-lean"
version = "0.1.0"
keywords = ["math", "jacobian", "formal-verification"]
defaultTargets = ["ExoticCCR"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "ExoticCCR"
